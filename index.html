<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Prayer, 1662</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f3f5;--card:#fff;--ink:#1c2230;--mute:#5b6577;--acc:#2c5b4f;--rule:#d5dae1;--rub:#9a3b32}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1b212b;--ink:#e6e9ef;--mute:#98a2b3;--acc:#7fc1ad;--rule:#2c3543;--rub:#e08a7f}}
:root[data-theme="dark"]{--bg:#12161d;--card:#1b212b;--ink:#e6e9ef;--mute:#98a2b3;--acc:#7fc1ad;--rule:#2c3543;--rub:#e08a7f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 64px}
h1{font-size:1.5rem;margin:8px 0 2px}
.sub{color:var(--mute);margin:0 0 14px;font-size:.95rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;font:15px system-ui,sans-serif}
.bar select,.bar input,.tabs button{font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;cursor:pointer;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
section{background:var(--card);border-left:3px solid var(--acc);padding:10px 16px;margin:12px 0;border-radius:0 6px 6px 0}
h2{font-size:1.05rem;color:var(--rub);margin:4px 0 6px;font-weight:600;font-style:italic}
p{margin:.4em 0;white-space:pre-line}
.r{color:var(--rub)}
a{color:var(--acc);font-weight:600}
input.les{width:100%;font:16px system-ui,sans-serif;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--bg);color:var(--ink);margin:4px 0}
.note{font:14px/1.5 system-ui,sans-serif;color:var(--mute)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>

<main>
<h1>Daily Prayer</h1>
<p class="sub">Morning and Evening Prayer, Book of Common Prayer 1662</p>
<div class="bar">

<button id="te" aria-pressed="false">Evening Prayer</button>
</div>
<div id="out"></div>
<p class="note">Lessons follow the 1662 calendar by date. Readings open on BibleGateway in your chosen translation, and Apocrypha readings open in the NRSV Anglicised. An override you type is remembered for that date.</p>
</main>

const EX=`Dearly beloved brethren, the Scripture moveth us in sundry places to acknowledge and confess our manifold sins and wickedness; and that we should not dissemble nor cloke them before the face of Almighty God our heavenly Father; but confess them with an humble, lowly, penitent, and obedient heart; to the end that we may obtain forgiveness of the same, by his infinite goodness and mercy. And although we ought at all times humbly to acknowledge our sins before God; yet ought we most chiefly so to do, when we assemble and meet together to render thanks for the great benefits that we have received at his hands, to set forth his most worthy praise, to hear his most holy Word, and to ask those things which are requisite and necessary, as well for the body as the soul. Wherefore I pray and beseech you, as many as are here present, to accompany me with a pure heart and humble voice, unto the throne of the heavenly grace, saying after me;`;
const CONF=`Almighty and most merciful Father;
We have erred, and strayed from thy ways like lost sheep,
We have followed too much the devices and desires of our own hearts,
We have offended against thy holy laws,
We have left undone those things which we ought to have done,
And we have done those things which we ought not to have done,
And there is no health in us:
But thou, O Lord, have mercy upon us, miserable offenders;
Spare thou them, O God, which confess their faults,
Restore thou them that are penitent;
According to thy promises declared unto mankind in Christ Jesu our Lord:
And grant, O most merciful Father, for his sake,
That we may hereafter live a godly, righteous, and sober life,
To the glory of thy holy Name. Amen.`;
const ABS=`Almighty God, the Father of our Lord Jesus Christ, who desireth not the death of a sinner, but rather that he may turn from his wickedness, and live; and hath given power and commandment to his Ministers, to declare and pronounce to his people, being penitent, the Absolution and Remission of their sins: He pardoneth and absolveth all them that truly repent, and unfeignedly believe his holy Gospel. Wherefore let us beseech him to grant us true repentance, and his Holy Spirit, that those things may please him, which we do at this present; and that the rest of our life hereafter may be pure, and holy; so that at the last we may come to his eternal joy; through Jesus Christ our Lord. Amen.`;
const LP=`Our Father, which art in heaven, Hallowed be thy Name; Thy kingdom come; Thy will be done in earth, As it is in heaven. Give us this day our daily bread; And forgive us our trespasses, As we forgive them that trespass against us; And lead us not into temptation; But deliver us from evil: For thine is the kingdom, the power, and the glory, For ever and ever. Amen.`;
const TEDEUM=`We praise thee, O God: we acknowledge thee to be the Lord.
All the earth doth worship thee: the Father everlasting.
To thee all Angels cry aloud: the Heavens, and all the Powers therein.
To thee Cherubin, and Seraphin: continually do cry,
Holy, Holy, Holy: Lord God of Sabaoth;
Heaven and earth are full of the Majesty: of thy glory.
The glorious company of the Apostles: praise thee.
The goodly fellowship of the Prophets: praise thee.
The noble army of Martyrs: praise thee.
The holy Church throughout all the world: doth acknowledge thee;
The Father: of an infinite Majesty;
Thine honourable, true: and only Son;
Also the Holy Ghost: the Comforter.
Thou art the King of Glory: O Christ.
Thou art the everlasting Son: of the Father.
When thou tookest upon thee to deliver man: thou didst not abhor the Virgin's womb.
When thou hadst overcome the sharpness of death: thou didst open the Kingdom of Heaven to all believers.
Thou sittest at the right hand of God: in the glory of the Father.
We believe that thou shalt come: to be our Judge.
We therefore pray thee, help thy servants: whom thou hast redeemed with thy precious blood.
Make them to be numbered with thy Saints: in glory everlasting.
O Lord, save thy people: and bless thine heritage.
Govern them: and lift them up for ever.
Day by day: we magnify thee;
And we worship thy Name: ever world without end.
Vouchsafe, O Lord: to keep us this day without sin.
O Lord, have mercy upon us: have mercy upon us.
O Lord, let thy mercy lighten upon us: as our trust is in thee.
O Lord, in thee have I trusted: let me never be confounded.`;
const LP2=`Our Father, which art in heaven, Hallowed be thy Name; Thy kingdom come; Thy will be done in earth, As it is in heaven. Give us this day our daily bread; And forgive us our trespasses, As we forgive them that trespass against us; And lead us not into temptation; But deliver us from evil. Amen.`;
const OPEN=`Minister: O Lord, open thou our lips.
Answer: And our mouth shall shew forth thy praise.
Minister: O God, make speed to save us.
Answer: O Lord, make haste to help us.
Glory be to the Father, and to the Son, and to the Holy Ghost;
As it was in the beginning, is now, and ever shall be, world without end. Amen.
Minister: Praise ye the Lord.
Answer: The Lord's Name be praised.`;
const CREED=`I believe in God the Father Almighty, Maker of heaven and earth:
And in Jesus Christ his only Son our Lord, Who was conceived by the Holy Ghost, Born of the Virgin Mary, Suffered under Pontius Pilate, Was crucified, dead, and buried: He descended into hell; The third day he rose again from the dead; He ascended into heaven, And sitteth on the right hand of God the Father Almighty; From thence he shall come to judge the quick and the dead.
I believe in the Holy Ghost; The holy Catholick Church; The Communion of Saints; The Forgiveness of sins; The Resurrection of the body, And the Life everlasting. Amen.`;
const RESP=`Minister: The Lord be with you.
Answer: And with thy spirit.
Minister: Let us pray.
Lord, have mercy upon us.
Christ, have mercy upon us.
Lord, have mercy upon us.`;
const SUFF=`Minister: O Lord, shew thy mercy upon us.
Answer: And grant us thy salvation.
Minister: O Lord, save the King.
Answer: And mercifully hear us when we call upon thee.
Minister: Endue thy Ministers with righteousness.
Answer: And make thy chosen people joyful.
Minister: O Lord, save thy people.
Answer: And bless thine inheritance.
Minister: Give peace in our time, O Lord.
Answer: Because there is none other that fighteth for us, but only thou, O God.
Minister: O God, make clean our hearts within us.
Answer: And take not thy Holy Spirit from us.`;
const C_PEACE=`O God, who art the author of peace and lover of concord, in knowledge of whom standeth our eternal life, whose service is perfect freedom; Defend us thy humble servants in all assaults of our enemies; that we, surely trusting in thy defence, may not fear the power of any adversaries, through the might of Jesus Christ our Lord. Amen.`;
const C_GRACE=`O Lord our heavenly Father, Almighty and everlasting God, who hast safely brought us to the beginning of this day; Defend us in the same with thy mighty power; and grant that this day we fall into no sin, neither run into any kind of danger; but that all our doings may be ordered by thy governance, to do always that is righteous in thy sight; through Jesus Christ our Lord. Amen.`;
const C_DESIRES=`O God, from whom all holy desires, all good counsels, and all just works do proceed; Give unto thy servants that peace which the world cannot give; that both our hearts may be set to obey thy commandments, and also that by thee, we, being defended from the fear of our enemies, may pass our time in rest and quietness; through the merits of Jesus Christ our Saviour. Amen.`;
const C_DARK=`Lighten our darkness, we beseech thee, O Lord; and by thy great mercy defend us from all perils and dangers of this night; for the love of thy only Son, our Saviour, Jesus Christ. Amen.`;
const CLERGY=`Almighty and everlasting God, who alone workest great marvels; Send down upon our Bishops and Curates, and all Congregations committed to their charge, the healthful Spirit of thy grace; and that they may truly please thee, pour upon them the continual dew of thy blessing. Grant this, O Lord, for the honour of our Advocate and Mediator, Jesus Christ. Amen.`;

const GRACE=`The grace of our Lord Jesus Christ, and the love of God, and the fellowship of the Holy Ghost, be with us all evermore. Amen.`;

let office="m",ver="NRSVUE";
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)||""}catch(e){return ""}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const link=(ref,label)=>{const apo=/^(Wisdom|Ecclesiasticus|Baruch)/.test(ref);const q=ref.replace(/^Ecclesiasticus/,"Sirach").replace(/^Wisdom/,"Wisdom of Solomon");return `<a href="https://www.biblegateway.com/passage/?search=${encodeURIComponent(q)}&version=${apo?"NRSVA":ver}" target="_blank" rel="noopener">${label||ref}</a>`};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S=(h,b)=>`<section><h2>${h}</h2>${b}</section>`;
const P=t=>`<p>${esc(t)}</p>`;

function psalms(d){
  const day=d.getDate(),mo=d.getMonth(),yr=d.getFullYear();
  const leap=(yr%4==0&&yr%100!=0)||yr%400==0;
  let days=[Math.min(day,30)];
  if(mo==1){const last=leap?29:28;if(day==last){days=[];for(let i=day;i<=30;i++)days.push(i)}}
  return days.map(n=>PS[n-1][office=="m"?0:1]);
}
function lesson(key,title,tv){
  const v=store.get(key),cur=v||tv;
  const shown=tv?`<p>${esc(tv)}</p>`:`<p class="note">No lesson in the calendar for this day. It has proper lessons in the Prayer Book, or none are appointed.</p>`;
  return S(title,shown+`<div id="${key}-l">${cur?link(cur,"Read "+esc(cur)):""}</div><input class="les" id="${key}" data-tv="${esc(tv)}" value="${esc(v)}" placeholder="Override, e.g. Isaiah 9:2-7" aria-label="${title} override">`);
}
function render(){
  const d=new Date($("date").value+"T12:00:00"),ds=$("date").value,m=office=="m";
  const n=Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5),s=SENT[(2*n+(m?0:1))%SENT.length];
  const ps=psalms(d);
  let h="";
  h+=S("Opening sentence",P(s[0])+`<p class="r">${s[1]}</p>`);
  h+=S("Exhortation",P(EX));
  h+=S("General Confession",P(CONF));
  h+=S("Absolution",P(ABS));
  h+=S("The Lord's Prayer",P(LP));
  h+=S("Versicles",P(OPEN));
  if(m)h+=S("Venite",`<p>O come, let us sing unto the Lord. Psalm 95, said or sung.</p><p>${link("Psalm 95")}</p>`);
  h+=S(`Psalms for day ${d.getDate()} of the month`,`<p>${ps.map(r=>link(r.includes(":")?"Psalm "+r:"Psalms "+r,"Psalm"+(/[-,]/.test(r)?"s ":" ")+r)).join("<br>")}</p><p class="note">Ends with the Gloria Patri after each psalm.</p>`);
  const L=LESS[ds.slice(5)]||["","","",""],o=m?0:2;
  if(d.getDay()==0)h+=S("Sunday",`<p class="note">The Prayer Book appoints proper lessons for Sundays and other feasts in its Table of Proper Lessons, which is not in this calendar. Use the override boxes for those.</p>`);
  h+=lesson(`bcp:${ds}:${office}:1`,"First Lesson",L[o]);
  h+=S(m?"Te Deum Laudamus":"Magnificat or Cantate Domino",m?`${P(TEDEUM)}<p class="note">Or Benedicite, omnia opera, which is not included in this version.</p>`:`<p>The Song of Mary, ${link("Luke 1:46-55")}. Or Psalm 98, ${link("Psalm 98")}.</p>`);
  h+=lesson(`bcp:${ds}:${office}:2`,"Second Lesson",L[o+1]);
  h+=S(m?"Benedictus or Jubilate Deo":"Nunc Dimittis or Deus Misereatur",m?`<p>The Song of Zechariah, ${link("Luke 1:68-79")}. Or Psalm 100, ${link("Psalm 100")}.</p>`:`<p>The Song of Simeon, ${link("Luke 2:29-32")}. Or Psalm 67, ${link("Psalm 67")}.</p>`);
  h+=S("The Apostles' Creed",P(CREED));
  h+=S("Responses",P(RESP)+P(LP2));
  h+=S("Suffrages",P(SUFF));
  h+=S("Collects",`<p class="note">The Collect of the Day goes first, from your Prayer Book.</p>`+(m?P(C_PEACE)+P(C_GRACE):P(C_DESIRES)+P(C_DARK)));
  h+=S("Prayers",P(CLERGY)+P(CHRY)+P(GRACE));
  $("out").innerHTML=h;
  document.querySelectorAll("input.les").forEach(i=>i.addEventListener("input",()=>{
    store.set(i.id,i.value.trim());
    const c=i.value.trim()||i.dataset.tv;
    $(i.id+"-l").innerHTML=c?link(c,"Read "+esc(c)):"";

const t=new Date(),pad=n=>String(n).padStart(2,"0");
$("date").value=`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;

$("tm").onclick=()=>{office="m";tabs();render()};
$("te").onclick=()=>{office="e";tabs();render()};
